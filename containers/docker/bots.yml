services:
  tg-handler:
    image: docker.io/veotri/telellama-bots:local
    restart: always
    build:
      context: ..
      dockerfile: bots/Dockerfile
    environment:
      - API_KEYS_FILE=/run/secrets/api_keys
      - OLLAMA_API_URL
      - OLLAMA_MODEL
    volumes:
      - ${HOME}/.config/telellama/confs:/app/confs:ro,Z
      - ${HOME}/.local/share/bots-data/history:/app/history:Z
    secrets:
      - api_keys

secrets:
  api_keys:
    file: ${HOME}/.config/telellama/api_keys.txt
