services:
  tg-handler:
    image: veotri/tg-handler:v0.5.1
    build:
      context: .
      dockerfile: tg-handler/Dockerfile
    environment:
      API_KEYS_FILE: /run/secrets/api_keys
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_URL: ${LLM_API_URL}
    volumes:
      - ./confs:/app/confs:ro
      - ./history:/app/history 
    secrets:
      - api_keys
    restart: always

secrets:
  api_keys:
    file: api_keys.txt
